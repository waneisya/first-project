<header class="flex items-center justify-between px-6 h-14 bg-slate-900 shrink-0 shadow-md z-20">

  <!-- Left: Brand + Nav -->
  <div class="flex items-center gap-6">

    <!-- Brand -->
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-md bg-blue-500 flex items-center justify-center">
        <i class="pi pi-server text-white text-xs"></i>
      </div>
      <span class="text-white font-bold text-sm tracking-wide">TM R&D</span>
    </div>

    <!-- Divider -->
    <div class="w-px h-5 bg-white/10"></div>

    <!-- Nav links -->
    <nav class="flex items-center gap-1">

      <p-button
        [text]="true"
        (onClick)="goTo('/home')"
        styleClass="!px-3 !py-1.5 !rounded-lg !text-sm !font-medium !transition-colors !duration-150
                    {{ isActive('/home') ? '!bg-white/15 !text-white' : '!text-slate-400 hover:!bg-white/8 hover:!text-white' }}">
        <i class="pi pi-list text-xs mr-1.5"></i>
        Products
      </p-button>

      <p-button
        [text]="true"
        (onClick)="goTo('/dashboard')"
        styleClass="!px-3 !py-1.5 !rounded-lg !text-sm !font-medium !transition-colors !duration-150
                    {{ isActive('/dashboard') ? '!bg-white/15 !text-white' : '!text-slate-400 hover:!bg-white/8 hover:!text-white' }}">
        <i class="pi pi-chart-bar text-xs mr-1.5"></i>
        Dashboard
      </p-button>

    </nav>
  </div>

  <!-- Right: User + Logout -->
  <div class="flex items-center gap-3">
    <div class="text-right hidden sm:block">
      <p class="text-xs font-semibold text-slate-200 leading-tight">Admin</p>
      <p class="text-[10px] text-slate-400 leading-tight">TM R&D</p>
    </div>

    <p-avatar
      label="A"
      shape="circle"
      styleClass="!bg-blue-500 !text-white !text-sm !font-bold !w-8 !h-8" />

    <!-- Logout button -->
    <p-button
      [text]="true"
      (onClick)="confirmLogout()"
      pTooltip="Logout"
      tooltipPosition="bottom"
      styleClass="!text-slate-400 hover:!text-red-400 hover:!bg-white/8 !rounded-lg !p-2 !transition-colors !duration-150">
      <i class="pi pi-sign-out text-sm"></i>
    </p-button>
  </div>

</header>

<!-- Logout confirmation dialog -->
<p-dialog
  [(visible)]="logoutVisible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="!w-full !max-w-sm"
  (onHide)="onLogoutCancel()"
>
  <ng-template #header>
    <div class="flex items-center gap-2">
      <i class="pi pi-sign-out text-red-500"></i>
      <span class="font-semibold text-slate-800 dark:text-slate-100">Confirm Logout</span>
    </div>
  </ng-template>

  <div class="py-2 text-sm text-slate-600 dark:text-slate-300">
    Are you sure you want to log out? Your session will be ended.
  </div>

  <ng-template #footer>
    <div class="flex justify-end gap-2">
      <p-button
        label="Cancel"
        severity="secondary"
        [text]="true"
        (onClick)="onLogoutCancel()"
      />
      <p-button
        label="Logout"
        severity="danger"
        icon="pi pi-sign-out"
        (onClick)="onLogoutConfirm()"
      />
    </div>
  </ng-template>
</p-dialog>
